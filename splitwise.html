
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitWise Calculator</title>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>SplitWise</h1>
                <p>Split expenses. Keep things fair.</p>
            </div>
            <button id="themeToggle" class="theme-btn">🌙</button>
        </header>

        <div class="clock-card">
            <p>Today's Date & Time</p>
            <h3 id="clock">Loading...</h3>
        </div>

        <section class="card">
            <h2>Calculate Expenses</h2>
         
        <form id="expenseForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="totalAmount">Total amount (₹)</label>
                    <input type="number" id="totalAmount" placeholder="Enter amount" min="0.01" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="personCount">Number of people</label>
                    <input type="number" id="personCount" min="1" max="50" value="0"  required>
                </div>
            </div>

            <div class="form-group">
                <label for="expenseTitle">Bill name</label>
                <input type="text" id="expenseTitle" placeholder="e.g. Dinner, Trip" required>
            </div>

            <div class="form-group">
                <label>Names (optional)</label>
                <div id="nameFields" class="names-grid"></div>
            </div>

            <button type="submit" class="primary-btn"> Split the bill </button>
            <button type="reset" id="resetBtn" class="reset-btn"> Reset </button>
        </form>

        </section>

        <section id="resultSection" class="card hidden">
            <h2>Split Results</h2>
            <p id="expenseSummary"></p>
            <div id="results"></div>
            <button id="saveBtn" class="primary-btn"> Save Expense </button>
        </section>

        <section class="card">
            <div class="history-header">
                <h2>Expense History</h2>
                <button id="clearHistory" class="delete-btn"> Clear All </button>
            </div>
            <div id="history">
                <p class="empty">No saved expenses yet.</p>
            </div>
        </section>

      </div>
</body>
</html>
